name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate repository
        run: make check

      - name: Prepare allow-listed site source
        run: python3 scripts/prepare_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./build/pages-src
          destination: ./build/pages

      - name: Check rendered local links
        run: python3 scripts/check_pages_output.py --root build/pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
