name: Design sync

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate design, governance, contracts, code, and Helm
        run: make check

      - name: Validate changed-file design synchronization
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/check_design_sync.py --base "$BASE_REF"
