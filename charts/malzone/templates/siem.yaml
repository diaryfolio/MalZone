{{- if .Values.pocSiem.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: malzone-siem-sink
  labels:
    {{- include "malzone.labels" . | nindent 4 }}
    app.kubernetes.io/component: siem-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: malzone
      app.kubernetes.io/component: siem-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: malzone
        app.kubernetes.io/component: siem-sink
    spec:
      serviceAccountName: malzone-siem-sink
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: {{ include "malzone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["siem-sink"]
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.pocSiem.sinkResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: malzone-siem-sink
  labels:
    {{- include "malzone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: malzone
    app.kubernetes.io/component: siem-sink
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: malzone-siem-adapter
  labels:
    {{- include "malzone.labels" . | nindent 4 }}
    app.kubernetes.io/component: siem-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: malzone
      app.kubernetes.io/component: siem-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: malzone
        app.kubernetes.io/component: siem-adapter
    spec:
      serviceAccountName: malzone-siem-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: {{ include "malzone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["siem-adapter"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SIEM_ENDPOINT
              value: http://malzone-siem-sink:8081/events
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.pocSiem.adapterResources | nindent 12 }}
{{- end }}
