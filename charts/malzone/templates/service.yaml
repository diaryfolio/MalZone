apiVersion: v1
kind: Service
metadata:
  name: malzone-api
  labels:
    {{- include "malzone.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: malzone
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
