{{- if .Values.pocNetworkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: malzone-poc-runner-deny-all
  labels:
    {{- include "malzone.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: poc-runner
  policyTypes:
    - Ingress
    - Egress
{{- end }}
